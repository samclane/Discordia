<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The login page's URL holds its token: it mustn't follow a click anywhere as a Referer. -->
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<link rel="icon" href="/sprites/Actors/wanderer_class.png">
<style>
  :root { --bg: #0e0f13; --raise: #13151b; --card: #16181e; --well: #0b0c10; --line: #2a2d36; --text: #dfe2ea;
          --dim: #8a90a0; --accent: #e8b44a; --ink: #1a1408; --wrap: 1000px; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg);
         color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
  main { flex: 1; }
  a { color: var(--accent); }
  img.px { image-rendering: pixelated; }
  .wrap { width: min(var(--wrap), 100%); margin: 0 auto; padding: 0 20px; }
  h1, h2, h3 { line-height: 1.2; margin: 0; }
  code { padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--well);
         color: var(--accent); font: 600 .85em ui-monospace, Consolas, monospace; white-space: nowrap; }

  .btn { display: inline-block; padding: 9px 18px; border: 1px solid var(--accent); border-radius: 8px;
         background: var(--accent); color: var(--ink); font: 600 15px system-ui, sans-serif; text-decoration: none;
         cursor: pointer; transition: filter .1s, transform .1s; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: none; color: var(--text); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--accent); filter: none; }
  .btn:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* --- header / footer --- */
  .top { position: sticky; top: 0; z-index: 2; background: #0e0f13e6; backdrop-filter: blur(8px);
         border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 24px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 700; font-size: 18px;
           text-decoration: none; }
  .brand img { width: 28px; height: 28px; }
  .top nav { display: flex; gap: 20px; margin-right: auto; }
  .top nav a { color: var(--dim); text-decoration: none; font-size: 15px; }
  .top nav a:hover { color: var(--text); }
  .top .btn { padding: 6px 14px; font-size: 14px; }
  @media (max-width: 560px) { .top nav { display: none; } .top .wrap { justify-content: space-between; } }
  footer { border-top: 1px solid var(--line); color: var(--dim); font-size: 14px; }
  footer .wrap { padding-top: 22px; padding-bottom: 22px; }
  footer a { color: var(--dim); }

  /* --- home --- */
  .hero { padding: 72px 0 0; background: radial-gradient(ellipse at 50% 0%, #1d2030, var(--bg) 70%); }
  .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .12em;
             text-transform: uppercase; }
  .hero h1 { font-size: clamp(36px, 7vw, 60px); letter-spacing: -.02em; }
  .lede { max-width: 600px; margin: 16px 0 28px; color: #b8bdc9; font-size: 18px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  /* A strip of the world: the party walking past a town, between the trees. */
  .scene { display: flex; justify-content: center; align-items: flex-end; gap: clamp(4px, 2vw, 18px);
           margin-top: 56px; padding-bottom: 10px; border-bottom: 6px solid #2b2f3a; overflow: hidden; }
  .scene img { width: clamp(40px, 9vw, 72px); height: auto; filter: drop-shadow(0 3px 0 #0007); }
  .scene .walk { animation: bob 1.2s steps(2, jump-none) infinite; }
  .scene .walk:nth-of-type(2n) { animation-delay: -.6s; }
  .scene .far { width: clamp(30px, 6vw, 48px); opacity: .7; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .scene .walk { animation: none; } }
  @media (max-width: 560px) { .scene .far { display: none; } }

  section.band { padding: 72px 0; border-bottom: 1px solid var(--line); }
  section.band:nth-of-type(2n) { background: var(--raise); }
  .band h2 { font-size: 30px; }
  .band .intro { max-width: 640px; margin: 10px 0 32px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card { padding: 20px 22px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .card h3 { font-size: 17px; margin-bottom: 12px; }
  .card dl { margin: 0; display: grid; gap: 10px; }
  .card dt { margin: 0; }
  .card dd { margin: 2px 0 0; color: var(--dim); font-size: 14px; }
  .class { display: flex; gap: 16px; align-items: flex-start; }
  .class img { width: 56px; height: 56px; flex: none; }
  .class p { margin: 6px 0 0; color: var(--dim); font-size: 15px; }
  .tag { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: var(--well);
         border: 1px solid var(--line); color: var(--dim); font-size: 12px; font-weight: 600; vertical-align: 2px; }

  ol.steps { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
  ol.steps li { display: flex; gap: 14px; align-items: baseline; counter-increment: step; }
  ol.steps li::before { content: counter(step); flex: none; display: grid; place-items: center; width: 28px;
                        height: 28px; border: 1px solid var(--line); border-radius: 50%; background: var(--well);
                        color: var(--accent); font-size: 13px; font-weight: 600; }

  /* --- one-card pages: the login button, a spent link --- */
  .solo { display: grid; place-items: center; padding: 96px 20px 56px; }
  .solo .card { width: min(440px, 100%); padding: 0 28px 26px; text-align: center; }
  .solo .party { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: -58px 0 14px; }
  .solo .party img { width: 64px; height: 64px; filter: drop-shadow(0 3px 0 #0007); }
  .solo .party .far { width: 44px; height: 44px; }
  .solo h1 { font-size: 24px; }
  .solo .sub { margin: 6px 0 22px; color: var(--dim); }
  .solo ol.steps { text-align: left; }
  .solo form .btn { width: 100%; padding: 12px; font-size: 16px; }
  .fine { margin: 14px 0 0; color: var(--dim); font-size: 13px; }

  /* --- logged in: the header's "you", and the character sheet --- */
  .account { display: flex; align-items: center; gap: 14px; }
  .me-link { display: flex; align-items: center; gap: 6px; max-width: 160px; color: var(--text); font-size: 14px;
             font-weight: 600; text-decoration: none; }
  .me-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-link img { width: 24px; height: 24px; flex: none; }
  .me-link:hover span { color: var(--accent); }
  @media (max-width: 400px) { .account .btn { display: none; } }

  .sheet { padding: 48px 0 72px; background: radial-gradient(ellipse at 20% 0%, #1d2030, var(--bg) 60%); }
  .who-card { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 24px; margin-bottom: 28px; }
  .avatar { width: 96px; height: 96px; padding: 8px; flex: none; background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; }
  .who-text { flex: 1; min-width: 200px; }
  .who-text h1 { font-size: clamp(28px, 5vw, 40px); overflow-wrap: anywhere; }
  .who-text .eyebrow { margin-bottom: 4px; }
  .where { margin: 4px 0 0; color: var(--dim); }
  .who-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .who-actions form { margin: 0; }
  .alert { margin: 0 0 24px; padding: 14px 18px; border: 1px solid #e8b44a66; border-radius: 12px;
           background: #e8b44a14; }
  .alert b { color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .stat h3 { margin: 0; color: var(--dim); font-size: 13px; font-weight: 600; letter-spacing: .08em;
             text-transform: uppercase; }
  .big { margin: 6px 0 10px; font-size: 32px; font-weight: 700; line-height: 1.1; }
  .big span { color: var(--dim); font-size: 18px; font-weight: 500; }
  .meter { height: 8px; border-radius: 4px; background: var(--well); overflow: hidden; }
  .meter i { display: block; height: 100%; background: #5ad17a; }
  .meter.low i { background: #e05a4a; }
  .meter.xp i { background: var(--accent); }
  .note { margin: 10px 0 0; color: var(--dim); font-size: 13px; }
  .kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .items { margin: 0; padding: 0; list-style: none; }
  .items li { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .items li:first-child { border-top: 0; }
  .items .slot { width: 82px; flex: none; color: var(--dim); font-size: 13px; }
  .items .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .items .stat-tag { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .items .empty-slot .name { color: var(--dim); font-style: italic; }
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img class="px" src="/sprites/Actors/wanderer_class.png" alt="">Discordia</a>
    <nav aria-label="Site">
      <a href="/#how">How to play</a>
      <a href="/#classes">Classes</a>
      <a href="/#join">The map</a>
    </nav>
    {{ACCOUNT}}
  </div>
</header>

<main>
{{BODY}}
</main>

<footer>
  <div class="wrap">
    Discordia, a MUD for Discord ·
    <a href="https://github.com/samclane/Discordia">Source on GitHub</a> ·
    Art from <a href="https://kenney.nl/assets/rpg-urban-pack">Kenney's RPG Urban Pack</a> (CC0)
  </div>
</footer>
</html>
