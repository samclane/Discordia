<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The login page's URL holds its token: it mustn't follow a click anywhere as a Referer. -->
<meta name="referrer" content="no-referrer">
<title>{{WORLD}} · Discordia</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0e0f13; --card: #16181e; --well: #0b0c10; --line: #2a2d36; --text: #dfe2ea; --dim: #8a90a0;
          --accent: #e8b44a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 72px 16px 24px; color: var(--text);
         background: radial-gradient(ellipse at 50% 35%, #1c1f29, var(--bg) 70%) fixed var(--bg);
         font: 15px/1.5 system-ui, sans-serif; }
  main { width: min(420px, 100%); padding: 0 28px 26px; text-align: center; background: var(--card);
         border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 64px #0009; }

  /* The party stands on the card's top edge. */
  .party { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: -58px 0 14px; }
  .party img { width: 64px; height: 64px; image-rendering: pixelated; filter: drop-shadow(0 3px 0 #0007);
               animation: bob 1.2s steps(2, jump-none) infinite; }
  .party img:nth-child(3) { animation-delay: -.4s; }
  .party img:nth-child(4) { animation-delay: -.8s; }
  .party .tree { width: 44px; height: 44px; animation: none; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .party img { animation: none; } }

  h1 { margin: 0; font-size: 22px; line-height: 1.25; }
  .sub { margin: 4px 0 22px; color: var(--dim); }
  code { padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--well);
         color: var(--accent); font: 600 13px ui-monospace, Consolas, monospace; white-space: nowrap; }

  ol { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: step; text-align: left; }
  li { display: flex; gap: 12px; align-items: baseline; counter-increment: step; }
  li::before { content: counter(step); flex: none; display: grid; place-items: center; width: 24px; height: 24px;
               border: 1px solid var(--line); border-radius: 50%; background: var(--well); color: var(--accent);
               font-size: 12px; font-weight: 600; }

  button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #1a1408;
           font: 600 16px system-ui, sans-serif; cursor: pointer; transition: filter .1s, transform .1s; }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .fine { margin: 14px 0 0; color: var(--dim); font-size: 12px; }
</style>

<main>
  <div class="party" aria-hidden="true">
    <img class="tree" src="/sprites/Structures/wilds_0.png" alt="">
    <img src="/sprites/Actors/wanderer_class.png" alt="">
    <img src="/sprites/Actors/soldier_class.png" alt="">
    <img src="/sprites/Actors/raider_class.png" alt="">
    <img class="tree" src="/sprites/Structures/wilds_3.png" alt="">
  </div>
  {{BODY}}
</main>
</html>
